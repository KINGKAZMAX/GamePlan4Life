     Windows + Chrome:
       "C:\Program Files\Google\Chrome\Application\chrome.exe" --headless --disable-gpu ^
         --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 ^
         --screenshot=og.png tools/og.html
     macOS:
       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless --disable-gpu \
         --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
         --screenshot=og.png tools/og.html
     像素字体用 tools/fonts/ 下的子集（Zpix、Press Start 2P），与本文件同目录的 fonts/ 相对引用，
     移动 og.html 时连同 fonts/ 一起动。
     三个数字的口径：条目数、A 级条数取自 README 正文（不含「怎么读」示例块里的那条），

<!doctype html><meta charset="utf-8">
<style>
@font-face{font-family:"Zpix-sub";src:url("fonts/zpix-subset.woff2") format("woff2");font-weight:400;font-style:normal}
@font-face{font-family:"PS2P-sub";src:url("fonts/pressstart-subset.woff2") format("woff2");font-weight:400;font-style:normal}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#fff;color:#0d0d0d;position:relative;overflow:hidden}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(13,13,13,.06) 1px,transparent 1px);background-size:14px 14px;-webkit-mask-image:linear-gradient(115deg,rgba(0,0,0,.9),transparent 60%)}
.in{position:relative;padding:70px 84px 0;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:44px;height:44px;background:#0d0d0d;display:grid;place-items:center;flex:none}
.mark svg{width:28px;height:24px}
.brand .en{font-family:"PS2P-sub",monospace;font-size:13px;letter-spacing:.34em;color:#6e6e80}
.hair{height:1px;background:#e5e5ea;margin-top:34px}
h1{margin-top:40px;font-family:"Zpix-sub",sans-serif;font-weight:400;font-size:104px;line-height:1.16;letter-spacing:.02em;color:#0d0d0d}
.sub{margin-top:24px;font-size:19px;line-height:1.75;color:#6e6e80;max-width:34em}
.sub b{color:#0d0d0d;font-weight:600}
.stats{position:absolute;left:84px;right:84px;bottom:66px;display:flex;border-top:1px solid #e5e5ea;padding-top:24px;font-size:16px;color:#6e6e80;white-space:nowrap}
.cell{flex:1;display:flex;align-items:baseline;gap:10px}
.cell+.cell{border-left:1px solid #e5e5ea;padding-left:32px}
.cell b{font-family:"PS2P-sub",monospace;font-weight:400;font-size:32px;color:#0d0d0d}
.strip{position:absolute;left:0;right:0;bottom:0;height:14px;background:#0d0d0d}
</style>
<div class="dots"></div>
<div class="in">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 7 6" shape-rendering="crispEdges" fill="#fff"><rect x="1" width="2" height="1"/><rect x="4" width="2" height="1"/><rect y="1" width="7" height="2"/><rect x="1" y="3" width="5" height="1"/><rect x="2" y="4" width="3" height="1"/><rect x="3" y="5" width="1" height="1"/></svg></span>
    <span class="en">LIFE WALKTHROUGH</span>
  </div>
  <div class="hair"></div>
  <h1>人生通关手册</h1>
  <div class="sub">用最少的钱、时间和精力，换回最多的<b>寿命、金钱、时间和人身自由</b>。每条攻略写明花掉什么、换回什么、证据有多硬，来源只引期刊论文和官方文件。</div>
  <div class="stats">
    <div class="cell"><b>909</b> 条建议</div>
    <div class="cell">A 级证据 <b>519</b> 条</div>
    <div class="cell"><b>1775</b> 条原始文献链接</div>
  </div>
  <div class="strip"></div>
</div>
